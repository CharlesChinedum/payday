version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Give new releases two weeks before proposing them (supply-chain hygiene).
    cooldown:
      default-days: 14
    ignore:
      # Node types follow the Node version the app runs on (24, in CI and on Vercel),
      # not the newest Node: raise this together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /contract
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
